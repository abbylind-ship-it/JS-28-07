<script>
    function CuentaBancaria (saldoInicial){
        let saldo = saldoInicial
        return{
            depositar:function(monto){
                saldo=saldo+monto
                console.log("Tu saldo es:" + saldo);
            }
        }
    }
    const miCuenta=CuentaBancaria(10000)
    miCuenta.depositar(200000)
    miCuenta.depositar(16000)
</script>
